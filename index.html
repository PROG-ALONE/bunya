<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بُنية — التغذية والتشريح والأداء</title>
<meta name="description" content="كورس تغذية علمي، وتشريح تفاعلي للعضلات والعظام والمفاصل، وبرنامج غذائي شخصي، ودليل لاعب كرة القدم">
<meta name="theme-color" content="#161b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بُنية">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ======== بُنية — التغذية والتشريح والأداء ======== */
:root {
  color-scheme: light;
  --bg: #eff2f7;
  --card: #ffffff;
  --card-2: #f5f7fb;
  --ink: #161b33;
  --ink-2: #4a5373;
  --muted: #7f88a4;
  --line: #dce1ec;
  --accent: #3443a6;
  --accent-ink: #ffffff;
  --accent-soft: #e3e7f8;
  --muscle: #c2453b;
  --muscle-soft: #f8e1df;
  --bone: #c9b186;
  --bone-soft: #f4eddd;
  --green: #23845f;
  --green-soft: #dcf1e8;
  --amber: #b97c0c;
  --amber-soft: #fbf0d6;
  --red: #c93a3a;
  --red-soft: #fae0e0;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --shadow: 0 1px 0 rgba(22, 27, 51, .05), 0 10px 30px -18px rgba(22, 27, 51, .35);
  --r: 16px;
  --font: 'Readex Pro', -apple-system, 'SF Arabic', 'Geeza Pro', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1222; --card: #171b30; --card-2: #1e2340; --ink: #e8eaf4; --ink-2: #aab1cc; --muted: #7d85a3; --line: #2b3152;
    --accent: #8d9bff; --accent-ink: #0f1222; --accent-soft: #252c55; --muscle: #ec7a70; --muscle-soft: #3a2125;
    --bone: #d9c39a; --bone-soft: #332d22; --green: #4fc495; --green-soft: #15362b; --amber: #e3ad45; --amber-soft: #3a2f15; --red: #ef7272; --red-soft: #3c1f22;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --shadow: 0 1px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1222; --card: #171b30; --card-2: #1e2340; --ink: #e8eaf4; --ink-2: #aab1cc; --muted: #7d85a3; --line: #2b3152;
  --accent: #8d9bff; --accent-ink: #0f1222; --accent-soft: #252c55; --muscle: #ec7a70; --muscle-soft: #3a2125;
  --bone: #d9c39a; --bone-soft: #332d22; --green: #4fc495; --green-soft: #15362b; --amber: #e3ad45; --amber-soft: #3a2f15; --red: #ef7272; --red-soft: #3c1f22;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --shadow: 0 1px 0 rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--series-1); outline-offset: 2px; }
.en { direction: ltr; unicode-bidi: isolate; color: var(--ink-2); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ---------- الهيكل ---------- */
.top {
  position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1200px; margin: 0 auto; padding: 10px clamp(16px, 3vw, 32px); display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.tabs { display: flex; gap: 2px; }
.tabs a { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 15px; }
.tabs a svg { width: 19px; height: 19px; }
.tabs a:hover { background: var(--card); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.top .spacer { flex: 1; }
.themebtn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; }
.themebtn svg { width: 18px; height: 18px; }
main { max-width: 1200px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 32px) 120px; }
.bottombar { display: none; }
@media (max-width: 900px) {
  .tabs { display: none; }
  .bottombar {
    display: flex; position: fixed; bottom: 0; inset-inline: 0; z-index: 40; background: var(--card); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bottombar a { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); text-decoration: none; gap: 2px; padding: 3px 0; }
  .bottombar a svg { width: 22px; height: 22px; }
  .bottombar a[aria-current="page"] { color: var(--accent); font-weight: 600; }
}

/* ---------- عناصر عامة ---------- */
h1, h2, h3, h4 { line-height: 1.3; letter-spacing: -.2px; }
.page-head { margin-bottom: 22px; }
.page-head h1 { font-size: clamp(26px, 3.4vw, 36px); margin: 0 0 6px; }
.page-head p { margin: 0; color: var(--ink-2); max-width: 70ch; font-size: 17px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 19px; margin: 0 0 12px; }
.card h3 { font-size: 16px; margin: 16px 0 6px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1000px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .g2, .g3, .g4 { grid-template-columns: 1fr; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack > * + * { margin-top: 16px; }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--card-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 999px; padding: 2px 10px; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); }
.pill.red { background: var(--red-soft); color: var(--red); }
.pill.muscle { background: var(--muscle-soft); color: var(--muscle); }
.pill.bone { background: var(--bone-soft); color: var(--ink-2); }
.note { border-radius: 12px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; margin: 14px 0; }
.note svg { flex: none; width: 20px; height: 20px; margin-top: 3px; }
.note.info { background: var(--accent-soft); } .note.info svg { color: var(--accent); }
.note.warn { background: var(--amber-soft); } .note.warn svg { color: var(--amber); }
.note.bad { background: var(--red-soft); } .note.bad svg { color: var(--red); }
.note.ok { background: var(--green-soft); } .note.ok svg { color: var(--green); }
table.t { width: 100%; border-collapse: collapse; font-size: 15px; }
.t th, .t td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
.t th { font-size: 13px; color: var(--ink-2); background: var(--card-2); font-weight: 600; }
.t-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; margin: 14px 0; }
.t-wrap .t th:first-child, .t-wrap .t td:first-child { padding-inline-start: 14px; }
.t-wrap .t tr:last-child td { border-bottom: 0; }

/* ---------- الرئيسية ---------- */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; align-items: center; margin: 8px 0 30px; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.12; margin: 0 0 14px; letter-spacing: -1px; font-weight: 700; }
.hero p { font-size: 18.5px; color: var(--ink-2); margin: 0 0 22px; max-width: 46ch; }
.levels { display: flex; flex-direction: column; gap: 6px; }
.levels .lv { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; text-decoration: none; color: var(--ink); }
.levels .lv:hover { border-color: var(--accent); }
.levels .lv i { font-style: normal; font-size: 13px; color: var(--muted); width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.levels .lv b { font-weight: 600; }
.levels .lv .d { color: var(--ink-2); font-size: 14px; margin-inline-start: auto; }
.levels .lv .bar { width: 6px; align-self: stretch; border-radius: 4px; }
.sections { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .sections { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .sections { grid-template-columns: 1fr; } }
.sec { text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; }
.sec:hover { border-color: var(--accent); }
.sec .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.sec .ico svg { width: 24px; height: 24px; }
.sec b { font-size: 18px; }
.sec span { color: var(--ink-2); font-size: 14.5px; }

/* ---------- الاستبيان ---------- */
.wizard { max-width: 860px; margin: 0 auto; }
.steps { display: flex; gap: 6px; margin-bottom: 20px; }
.steps button { flex: 1; border: 0; background: transparent; padding: 0; cursor: pointer; text-align: start; }
.steps .bar { height: 6px; border-radius: 9px; background: var(--line); }
.steps button[data-st="done"] .bar { background: var(--accent); }
.steps button[data-st="now"] .bar { background: var(--accent); opacity: .5; }
.steps small { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
.steps button[data-st="now"] small { color: var(--ink); font-weight: 600; }
.q { margin-bottom: 22px; }
.q > label, .q > .ql { display: block; font-weight: 600; margin-bottom: 8px; font-size: 16px; }
.q .hint { font-size: 14px; color: var(--ink-2); margin: -4px 0 8px; }
input[type=number], input[type=text], select { width: 100%; min-height: 48px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-2); font-size: 17px; }
input[type=number] { direction: ltr; text-align: right; }
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.unit { position: relative; }
.unit span { position: absolute; inset-inline-end: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
.unit input { padding-inline-end: 54px; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.choice { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: start; display: flex; flex-direction: column; gap: 2px; min-height: 52px; justify-content: center; }
.choice b { font-weight: 600; font-size: 15px; }
.choice span { font-size: 13px; color: var(--ink-2); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-pressed="true"] b { color: var(--accent); }
.howto { background: var(--card-2); border-radius: 12px; padding: 4px 14px; margin-top: 8px; font-size: 14.5px; }
.howto summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 8px 0; }
.howto ol, .howto ul { margin: 0 0 10px; padding-inline-start: 20px; }
.wiz-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }

/* النتائج */
.result-hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .result-hero { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat .l { font-size: 13.5px; color: var(--ink-2); }
.stat .v { font-size: 32px; font-weight: 700; letter-spacing: -.6px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.stat .d { font-size: 13px; color: var(--muted); }
.scale-bar { position: relative; height: 12px; border-radius: 9px; margin: 26px 0 30px; display: flex; overflow: visible; }
.scale-bar > i { height: 100%; }
.scale-bar > i:first-child { border-radius: 9px 0 0 9px; } .scale-bar > i:last-of-type { border-radius: 0 9px 9px 0; }
.scale-bar .mk { position: absolute; top: -8px; width: 4px; height: 28px; background: var(--ink); border-radius: 3px; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--card); }
.scale-bar .mk b { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
.scale-bar .lb { position: absolute; top: 18px; font-size: 11.5px; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.macro-bar { display: flex; height: 38px; border-radius: 10px; overflow: hidden; gap: 2px; margin: 10px 0; }
.macro-bar > div { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; }
.eq { background: var(--card-2); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }
.eq code { direction: ltr; unicode-bidi: isolate; display: block; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13.5px; margin: 4px 0; color: var(--ink); white-space: normal; text-align: left; }
.hands { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .hands { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hand { background: var(--card-2); border-radius: 12px; padding: 12px; text-align: center; }
.hand svg { width: 44px; height: 44px; }
.hand b { display: block; font-size: 22px; }
.hand span { font-size: 13px; color: var(--ink-2); }
.menu-day .meal { border-bottom: 1px dashed var(--line); padding: 10px 0; }
.menu-day .meal:last-child { border-bottom: 0; }
.menu-day .meal h4 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; }
.menu-day .meal ul { margin: 0; padding-inline-start: 20px; font-size: 14.5px; }
.burn { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.burn:last-child { border-bottom: 0; }
.burn b { font-size: 15.5px; }
.burn .k { text-align: end; font-weight: 700; font-variant-numeric: tabular-nums; }
.burn .k small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.burn p { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--ink-2); }

/* ---------- الكورس ---------- */
.modules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1000px) { .modules { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .modules { grid-template-columns: 1fr; } }
.mod { text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; position: relative; }
.mod:hover { border-color: var(--accent); }
.mod .no { font-size: 13px; color: var(--accent); font-weight: 600; }
.mod b { font-size: 17.5px; }
.mod span { color: var(--ink-2); font-size: 14px; }
.mod .prog { height: 5px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: auto; }
.mod .prog > i { display: block; height: 100%; background: var(--green); }
.lesson-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 900px) { .lesson-layout { grid-template-columns: 1fr; } .toc { display: none; } }
.toc { position: sticky; top: 84px; font-size: 14.5px; }
.toc a { display: block; padding: 7px 12px; border-radius: 9px; color: var(--ink-2); text-decoration: none; }
.toc a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc a.done::after { content: ' ✓'; color: var(--green); }
.article { max-width: 74ch; }
.article h1 { font-size: clamp(26px, 3vw, 34px); margin: 0 0 8px; }
.article .lead { font-size: 19px; color: var(--ink-2); }
.article h2 { font-size: 22px; margin: 34px 0 10px; }
.article h3 { font-size: 18px; margin: 24px 0 8px; }
.article p, .article li { font-size: 17px; line-height: 1.9; }
.article li + li { margin-top: 4px; }
.article .box { background: var(--card); border: 1px solid var(--line); border-inline-start: 4px solid var(--accent); border-radius: 12px; padding: 14px 18px; margin: 18px 0; }
.article .box.green { border-inline-start-color: var(--green); }
.article .box.amber { border-inline-start-color: var(--amber); }
.article .box p:first-child { margin-top: 0; } .article .box p:last-child { margin-bottom: 0; }
.article figure { margin: 22px 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.article figcaption { font-size: 14px; color: var(--ink-2); margin-top: 10px; }
.article figure svg { display: block; margin: auto; max-width: 100%; height: auto; }
.refs { padding-inline-start: 20px; }
.refs li { direction: ltr; text-align: left; font-size: 14px !important; line-height: 1.6 !important; color: var(--ink-2); }
.quiz { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 30px; }
.quiz h2 { margin-top: 0 !important; }
.qq { margin: 18px 0; }
.qq p { font-weight: 600; margin: 0 0 8px; }
.qq .opts { display: grid; gap: 6px; }
.qq button { text-align: start; border: 1.5px solid var(--line); background: var(--card-2); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 15.5px; }
.qq button.right { border-color: var(--green); background: var(--green-soft); }
.qq button.wrong { border-color: var(--red); background: var(--red-soft); }
.qq .why { font-size: 14.5px; color: var(--ink-2); margin-top: 8px; }
.lesson-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; flex-wrap: wrap; }

/* ---------- التشريح ---------- */
.anat-top { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .anat-top { grid-template-columns: 1fr; } }
.bodymap { position: sticky; top: 84px; text-align: center; }
.bodymap svg { width: 100%; max-width: 330px; height: auto; display: block; margin: 8px auto 0; }
.bodymap .rg { fill: var(--muscle-soft); stroke: var(--muscle); stroke-width: 1.2; cursor: pointer; transition: fill .12s; }
.bodymap .rg:hover, .bodymap .rg:focus { fill: color-mix(in srgb, var(--muscle) 45%, var(--muscle-soft)); outline: none; }
.bodymap .rg.on { fill: var(--muscle); }
.bodymap .bn { fill: var(--bone-soft); stroke: var(--bone); stroke-width: 1.2; }
.bodymap .head { fill: var(--card-2); stroke: var(--line); stroke-width: 1.5; }

</tbody></table></div>
<h2>أساسي وغير أساسي</h2>
<p><b>المغذي الأساسي</b> <span class="en">(Essential)</span> هو اللي الجسم ما يكدر يصنعه، أو يصنعه بكمية ما تكفي، فلازم ياخذه من الأكل. أمثلة: 9 أحماض أمينية، وحمضين دهنيين (اللينوليك وألفا-لينولينك)، وأغلب الفيتامينات والمعادن. أما الكاربوهيدرات، فالجسم تقنياً يكدر يصنع الجلوكوز من البروتين والدهون، لكنها مهمة للأداء والألياف.</p>
<h2>الكثافة الغذائية</h2>
<p>أكلتين بنفس السعرات ممكن تختلف بالقيمة الغذائية كثير. 200 سعرة من العدس فيها بروتين وألياف وحديد وفولات، و200 سعرة من المشروبات الغازية فيها سكر بس. <b>الكثافة الغذائية</b> <span class="en">(Nutrient density)</span> هي كمية المغذيات لكل سعرة، وهي أهم مفهوم بأي دايت.</p>
<div class="box green"><p><b>الخلاصة:</b> السعرات تحدد الوزن، ونوعية الأكل تحدد الصحة وتركيب الجسم (عضل مقابل دهون).</p></div>`,

<p class="lead">السعرة اللي نحچي عليها بالدايت هي فعلياً <b>كيلو سعرة</b> <span class="en">(kcal)</span>: كمية الطاقة اللازمة لرفع حرارة 1 كغم ماي درجة مئوية واحدة.</p>
<ul><li>1 كيلو سعرة = 4.184 كيلو جول <span class="en">(kJ)</span>. بعض الملصقات الأوروبية تكتب الاثنين.</li>
<li>لما يكتبون "Calories" بحرف C كبير، المقصود kcal.</li></ul>
<h2>عوامل أتواتر <span class="en">(Atwater factors)</span></h2>
<p>بنهاية القرن 19، العالم ويلبر أتواتر حرق الأكل بجهاز اسمه <b>المسعر القنبلي</b> <span class="en">(Bomb calorimeter)</span>، وطرح منه الطاقة اللي تضيع بالفضلات والبول. فطلعت القيم اللي نستخدمها لليوم:</p>
<div class="t-wrap"><table class="t"><thead><tr><th>المغذي</th><th>سعرة لكل غرام</th></tr></thead><tbody>
<tr><td>كاربوهيدرات</td><td><b>4</b></td></tr><tr><td>بروتين</td><td><b>4</b></td></tr><tr><td>دهون</td><td><b>9</b></td></tr><tr><td>كحول</td><td><b>7</b></td></tr><tr><td>ألياف (تتخمر جزئياً بالقولون)</td><td>~2</td></tr></tbody></table></div>
<h3>مثال حساب</h3>
<p>بيضة كبيرة فيها تقريباً 6.3 غ بروتين، و5 غ دهون، و0.4 غ كارب:<br><span class="ltr">6.3×4 + 5×9 + 0.4×4 = 25.2 + 45 + 1.6 ≈ 72 kcal</span></p>
<div class="box"><p><b>ليش الدهون 9؟</b> لأن ذرات الكاربون بيها مختزلة أكثر (هيدروجين أكثر وأوكسجين أقل)، فتطلق طاقة أكثر لما تتأكسد. لهذا الجسم يخزن الطاقة كدهون: أخف وزن بأكبر طاقة.</p></div>`,

<p class="lead">الهضم يفكك الأكل لوحدات صغيرة تكدر تعبر جدار الأمعاء للدم: الكاربوهيدرات تصير سكريات أحادية، والبروتين يصير أحماض أمينية، والدهون تصير أحماض دهنية وجليسيرول.</p>
<div class="t-wrap"><table class="t"><thead><tr><th>المكان</th><th>شنو يصير</th></tr></thead><tbody>

<tr><td><b>الأمعاء الدقيقة</b></td><td>هنا أغلب الهضم والامتصاص. البنكرياس يفرز إنزيمات (أميليز، ليباز، تربسين)، والكبد يرسل الصفراء عن طريق المرارة حتى تستحلب الدهون. الجدار مليان زغابات <span class="en">(villi)</span> تكبّر المساحة لحدود ملعب تنس تقريباً.</td></tr>
<tr><td><b>الكبد</b></td><td>كل الدم الجاي من الأمعاء يمر بيه أولاً عن طريق الوريد البابي، فيعالج ويخزن ويوزع.</td></tr>
<tr><td><b>الأمعاء الغليظة</b></td><td>امتصاص الماء والأملاح. وبكتيريا القولون <span class="en">(Microbiome)</span> تخمّر الألياف وتنتج أحماض دهنية قصيرة السلسلة <span class="en">(SCFA)</span> مفيدة لصحة القولون.</td></tr>

<h2>مسار الدهون مختلف</h2>
<p>الأحماض الدهنية الطويلة ما تروح للدم مباشرة. تنبني من جديد داخل خلايا الأمعاء، وتتغلف بجزيئات اسمها <b>كايلومايكرونات</b> <span class="en">(Chylomicrons)</span>، وتدخل الجهاز الليمفاوي أول. لهذا الدهون تبطّئ تفريغ المعدة وتشبع أطول.</p>
<div class="box green"><p><b>تطبيق عملي:</b> وجبة بيها بروتين وألياف ودهون صحية تفرغ من المعدة أبطأ، فيرتفع سكر الدم بهدوء، وتشبع أطول.</p></div>`,

<p class="lead">ما نكدر نقيس الأيض بجهاز <b>المسعر غير المباشر</b> <span class="en">(Indirect calorimetry)</span> لكل شخص، فنستخدم معادلات مشتقة من دراسات على مئات الأشخاص.</p>

<h2>النشا: أميلوز وأميلوبكتين</h2>
<p>النشا هو مخزن الطاقة بالنبات، ويتكون من نوعين:</p>
<ul><li><b>أميلوز:</b> سلسلة مستقيمة، يتهضم أبطأ.</li><li><b>أميلوبكتين:</b> متفرّع كثير، فالإنزيمات تهاجمه من نقاط أكثر، ويتهضم أسرع.</li></ul>
<p>لما تطبخ التمن وتبرده، جزء من النشا يعيد ترتيب نفسه ويصير <b>نشا مقاوم</b> <span class="en">(Resistant starch)</span>، يتصرف مثل الألياف.</p>
<h2>الجلايكوجين: مخزن الجسم</h2>
<p>الجسم يخزن الجلوكوز كجلايكوجين: ~400 غ بالعضلات (يختلف حسب الحجم والتدريب) و~100 غ بالكبد. جلايكوجين الكبد يحافظ على سكر الدم، وجلايكوجين العضلة تستخدمه العضلة نفسها بس. وكل غرام جلايكوجين يخزن معه ~3 غ ماي، لهذا أول أسبوع بالدايت قليل الكارب ينزل الوزن بسرعة: ماي مو دهون.</p>`,

    { id: 'gi', title: 'البسيطة والمعقدة والمؤشر الجلايسيمي', html: `
<p class="lead">تقليدياً نقسم الكاربوهيدرات لـ "بسيطة" (سكريات أحادية وثنائية) و"معقدة" (نشويات وألياف). لكن الأهم فعلياً هو <b>شكد بسرعة ترفع سكر الدم</b>.</p>
<h2>المؤشر الجلايسيمي (GI)</h2>
<p>يقيس ارتفاع سكر الدم بعد أكل كمية من الطعام فيها 50 غ كارب متاح، مقارنة بـ 50 غ جلوكوز (= 100).</p>
<ul><li><b>منخفض:</b> 55 أو أقل (عدس، أغلب الفواكه، شوفان حبة كاملة، حليب)</li><li><b>متوسط:</b> 56–69 (رز بسمتي، خبز أسمر)</li><li><b>عالي:</b> 70 أو أكثر (خبز أبيض، بطاطا مهروسة، رز لزج، كورن فليكس)</li></ul>
<h2>الحمل الجلايسيمي (GL) — الأهم عملياً</h2>
<p>الـ GI ما ينتبه للكمية. البطيخ مثلاً مؤشره عالي، لكن الكارب بالحصة قليل. لهذا نستخدم:<br><span class="ltr">GL = GI × grams of carbs per serving ÷ 100</span><br>منخفض 10 أو أقل، وعالي 20 أو أكثر.</p>
<h2>شنو يغير سرعة امتصاص الكارب؟</h2>
<ul><li><b>الألياف:</b> تبطّئ تفريغ المعدة.</li><li><b>البروتين والدهون بنفس الوجبة:</b> نفس التأثير.</li><li><b>درجة الطبخ والطحن:</b> المطحون أو المطبوخ زيادة يرفع السكر أسرع.</li><li><b>درجة النضج:</b> الموز الناضج أعلى من الأخضر.</li><li><b>التبريد:</b> يزيد النشا المقاوم.</li></ul>
<h2>الأنسولين</h2>
<p>لما يرتفع سكر الدم، البنكرياس يفرز الأنسولين. يدخّل الجلوكوز للعضلات والكبد والدهون، ويوقف حرق الدهون مؤقتاً. هذا طبيعي وصحي. المشكلة بس لما يكون السكر عالي باستمرار والخلايا تقاوم الأنسولين (مقاومة الأنسولين).</p>
<div class="box green"><p><b>عملياً:</b> اختار الكارب الأقل تصنيعاً (حبة كاملة، بقوليات، فواكه كاملة مو عصير)، وكُله ويا بروتين وخضار.</p></div>`,

<h2>السكر الحر <span class="en">(Free sugars)</span></h2>
<p>أي سكر ينضاف للأكل (من المصنع أو انت بالبيت)، والسكر الموجود بالعسل والدبس والعصائر حتى الطبيعية. <b>التوصية</b> (WHO 2015): أقل من 10% من السعرات، والأفضل أقل من 5%. بدايت 2000 سعرة: أقل من 50 غ (~12 ملعقة صغيرة)، والأفضل 25 غ.</p>

<p class="lead">البروتين سلسلة طويلة من وحدات اسمها <b>الأحماض الأمينية</b>، مرتبطة بروابط ببتيدية. كل حمض أميني فيه ذرة كاربون مركزية، مرتبطة بأربع أشياء: مجموعة أمين <span class="en">(NH₂)</span>، ومجموعة كاربوكسيل <span class="en">(COOH)</span>، وهيدروجين، و<b>سلسلة جانبية (R)</b> تختلف من حمض لحمض وتحدد خصائصه.</p>
<h2>20 حمض أميني، 3 مجموعات</h2>

<p><b>حيلة للحفظ:</b> الأساسية التسعة بالإنكليزي تنحفظ بالاختصار <span class="en">PVT TIM HaLL</span>:</p><p dir="ltr" style="text-align:left" class="en">Phenylalanine, Valine, Threonine, Tryptophan, Isoleucine, Methionine, Histidine, Arginine*, Leucine, Lysine</p><p class="muted">* الأرجينين بالاختصار الأصلي ينضاف أحياناً للأطفال. للبالغين الأساسية تسعة بس.</p>
<h2>الأحماض متفرعة السلسلة (BCAA)</h2>
<p>الليوسين والآيزوليوسين والفالين. <b>الليوسين</b> هو "مفتاح" تشغيل بناء العضل (عن طريق مسار mTOR). لكن مكملات BCAA لوحدها ما تبني عضل كفاية، لأن البناء يحتاج كل الأحماض الأساسية. البروتين الكامل أفضل.</p>
<h2>مستويات بناء البروتين</h2>
<ol><li><b>أولي:</b> تسلسل الأحماض الأمينية.</li><li><b>ثانوي:</b> لفات حلزونية وصفائح.</li><li><b>ثالثي:</b> الطي ثلاثي الأبعاد.</li><li><b>رباعي:</b> عدة سلاسل سوا (مثل الهيموغلوبين).</li></ol>
<p>الطبخ والحامض بالمعدة "يفك" هذا الطي <span class="en">(Denaturation)</span>. هذا ما يقلل القيمة الغذائية، بالعكس يسهّل الهضم.</p>

<p class="lead">مو كل بروتين متساوي. الجودة تعتمد على شيئين: هل بيه كل الأحماض الأساسية بكميات كافية؟ وهل يتهضم بسهولة؟</p>
<h2>كامل وناقص</h2>
<ul><li><b>بروتين كامل:</b> بيه كل الأحماض الأساسية بنسب جيدة. مصادره: البيض، والحليب ومشتقاته، واللحوم، والسمك، والصويا، والكينوا.</li>

<div class="box green"><p><b>التكامل:</b> تمن ويا عدس (مجدرة)، وخبز ويا حمص، وبرغل ويا فاصوليا. أكلاتنا الشعبية تكمل البروتين بالفطرة. وما يحتاج تكون بنفس الوجبة، يكفي بنفس اليوم.</p></div>

<li><b>هدم بروتين العضل</b> <span class="en">(MPB — Muscle Protein Breakdown)</span>: يرتفع بالصيام والعجز الكبير والإجهاد.</li></ul>
<h2>الشروط الأساسية</h2>
<ol><li><b>الإشارة:</b> تمارين مقاومة بحمل كافي، مع زيادة تدريجية <span class="en">(Progressive overload)</span>.</li><li><b>المادة الخام:</b> بروتين كافي موزع على اليوم.</li><li><b>الطاقة:</b> سعرات كافية (فائض بسيط يساعد البناء الأسرع).</li><li><b>التعافي:</b> نوم 7–9 ساعات.</li></ol>
<h2>"النافذة الذهبية" بعد التمرين</h2>
<p>الفكرة القديمة كانت إنك لازم تاكل بروتين خلال 30 دقيقة. الدراسات الأحدث (Schoenfeld 2013) لقت إن <b>مجموع البروتين اليومي</b> أهم بكثير من التوقيت. النافذة أوسع بكثير (عدة ساعات)، خصوصاً إذا أكلت بروتين قبل التمرين.</p>
<h2>كم عضل ممكن تبني؟</h2>
<p>المبتدئ بظروف ممتازة ممكن يزيد ~0.5–1 كغم عضل بالشهر بالسنة الأولى، والمعدل يقل كثير مع الخبرة. أي وعد بـ "5 كيلو عضل بشهر" مو واقعي.</p>`,

<p class="lead">الكوليسترول ما يذوب بالدم، فينتقل داخل "حاملات" اسمها <b>البروتينات الدهنية</b> <span class="en">(Lipoproteins)</span>.</p>

  lessons: [
    { id: 'hydration', title: 'الماء بالجسم', html: `
<p class="lead">الماء ~60% من وزن الرجل البالغ و~50–55% من المرأة. العضلة ~75% ماي، والدهون ~10–20%، لهذا الشخص العضلي عنده ماي أكثر.</p>
<h2>وظائفه</h2><p>نقل المغذيات، وتنظيم الحرارة بالتعرق، وتشحيم المفاصل، وحماية الدماغ، وطرد الفضلات بالبول، ووسط لكل التفاعلات الكيميائية.</p>
<h2>كم تحتاج؟</h2>
<ul><li>الهيئة الأوروبية لسلامة الغذاء (EFSA 2010): <b>2.5 لتر للرجال و2.0 للنساء</b> من كل المصادر. الأكل يعطي ~20%، والباقي من المشروبات.</li><li>قاعدة تقريبية: ~30–35 مل لكل كغم، وتزيد مع الحر والتمرين.</li><li>بصيف العراق (45+ درجة) الاحتياج يرتفع كثير.</li></ul>
<h2>شلون تعرف إنك مرطّب؟</h2>
<ul><li><b>لون البول:</b> أصفر فاتح (لون الليمون) يعني ممتاز، وأصفر غامق يعني اشرب أكثر.</li><li><b>العطش</b> إشارة متأخرة نسبياً.</li><li><b>الوزن قبل وبعد التمرين:</b> كل 1 كغم نقص ≈ 1 لتر عرق.</li></ul>
<h2>للرياضيين</h2>
<ul><li>الكلية الأمريكية للطب الرياضي (ACSM): تجنب خسارة أكثر من 2% من وزن الجسم بالتعرق أثناء التمرين، لأن الأداء يتراجع.</li><li>بعد التمرين: اشرب ~1.25–1.5 لتر لكل كغم نقص.</li><li>التعرق الطويل (أكثر من ساعة بالحر) يحتاج صوديوم، مو بس ماي.</li><li><b>انتبه:</b> شرب ماي هواية بدون أملاح بالمجهود الطويل ممكن يسبب نقص صوديوم الدم (Hyponatremia)، وهي حالة خطيرة.</li></ul>`,
    }
  ],
  quiz: [
    { q: 'أي لون بول يدل على ترطيب جيد؟', o: ['شفاف تماماً دائماً', 'أصفر فاتح', 'أصفر غامق', 'برتقالي'], a: 1, why: 'الأصفر الفاتح هو المثالي. الغامق يعني جفاف.' },
    { q: 'الأداء الرياضي يتراجع مع خسارة سوائل أكثر من:', o: ['0.1%', '2% من وزن الجسم', '10%', '20%'], a: 1, why: 'ACSM توصي بتجنب خسارة أكثر من 2% من وزن الجسم.' }
  ]
});

COURSE.push({
  id: 'fatloss', title: 'خسارة الدهون وبناء العضل', desc: 'وين تروح الدهون، وشلون تحافظ على العضل، والثبات، وزيادة العضل.',
  lessons: [
    { id: 'where-fat-goes', title: 'وين تروح الدهون؟', html: `
<p class="lead">لما تنزل دهون، وين تروح فعلياً؟ تتحول لطاقة؟ تطلع بالعرق؟ الجواب يفاجئ أغلب الناس، حتى الأطباء.</p>
<p>بحث نُشر بمجلة BMJ (Meerman & Brown 2014) حسب الكيمياء: لما تتأكسد الدهون، <b>~84% منها تطلع كثاني أكسيد الكاربون من الرئة</b>، و~16% كماي (بول وعرق وتنفس). يعني أكثر الدهون <b>تتنفسها للخارج</b>.</p>
<h2>الخطوات</h2>
<ol><li><b>العجز:</b> تصرف طاقة أكثر مما تاكل.</li><li><b>التحلل</b> <span class="en">(Lipolysis)</span>: هرمونات مثل الأدرينالين والجلوكاجون تفكك الدهون الثلاثية بالخلية الدهنية لأحماض دهنية وجليسيرول.</li><li><b>النقل:</b> الأحماض الدهنية تمشي بالدم للعضلات والكبد.</li><li><b>الأكسدة:</b> بالمايتوكوندريا (بيتا-أكسدة ودورة كريبس) تتحول لطاقة وCO₂ وماء.</li></ol>
<h2>هل تكدر تحرق دهون منطقة معينة؟</h2>
<p><b>لا.</b> تمارين البطن ما تحرق دهون البطن بالتحديد. الجسم يسحب الدهون من كل المناطق حسب الوراثة والهرمونات، وهذا اسمه خرافة <span class="en">Spot reduction</span>.</p>`,
    },
    { id: 'keep-muscle', title: 'الحفاظ على العضل بالدايت', html: `
<p class="lead">النزول السريع بدون تخطيط ممكن يكون ربعه أو أكثر من الكتلة الخالية من الدهون. الهدف إن أغلب النزول يكون دهون.</p>
<h2>الأعمدة الأربعة</h2>
<ol><li><b>عجز معتدل:</b> نزول 0.5–1% من الوزن بالأسبوع. دراسة على رياضيين (Garthe 2011): النزول الأبطأ (0.7%/أسبوع) حافظ على العضل وزاد القوة أكثر من السريع (1.4%/أسبوع).</li>
<li><b>بروتين عالي:</b> 1.6–2.4 غ/كغم، وبالعجز الكبير أعلى.</li>
<li><b>تمرين مقاومة:</b> هذي الإشارة اللي تقول للجسم "العضل مطلوب". بدونها الجسم يتخلص منه.</li>
<li><b>نوم كافي:</b> بتجربة Nedeltcheva 2010، نفس الدايت مع 5.5 ساعة نوم بدل 8.5 خلّى نسبة الدهون من الوزن المفقود تنزل ~55%، وخسارة الكتلة الخالية من الدهون تزيد ~60%.</li></ol>
<h2>إذا ما تكدر تتمرن الجزء السفلي</h2>
<p>إصابة ركبة أو كاحل ما تمنعك تخسر دهون. الأكل مسؤول عن أغلب العجز. ودرّب الجزء العلوي والجذع حتى تحافظ على عضلهم، والتأهيل يحافظ على عضل الرجلين قدر الإمكان.</p>`,
    },
    { id: 'plateau', title: 'الثبات والتكيف', html: `
<p class="lead">بعد أسابيع من الدايت، النزول يبطأ أو يوقف. هذا طبيعي، وله أسباب واضحة.</p>
<ol><li><b>وزنك صار أقل</b>، فحرقك أقل: جسم أصغر يصرف طاقة أقل.</li><li><b>التكيف الأيضي</b> <span class="en">(Adaptive thermogenesis)</span>: الجسم يقلل الحرق أكثر مما يتوقع من نقص الوزن، عن طريق الهرمونات (الغدة الدرقية، اللبتين).</li><li><b>NEAT ينزل</b> بدون ما تحس: تتحرك أقل، وتكعد أكثر.</li><li><b>احتباس الماء:</b> الكورتيزول والملح والدورة الشهرية ممكن يخبون نزول الدهون أسابيع.</li></ol>
<h2>شنو تسوي؟</h2>
<ul><li>تأكد من الالتزام الحقيقي: سجّل الأكل أسبوع بدقة.</li><li>راقب الخصر، مو بس الوزن.</li><li>ثبّت الخطوات اليومية.</li><li>عدّل السعرات 100–200 لتحت، أو زيد النشاط.</li><li><b>استراحة دايت</b> <span class="en">(Diet break)</span>: بدراسة MATADOR (Byrne 2018)، التناوب بين أسبوعين دايت وأسبوعين ثبات، على 16 أسبوع دايت فعلي، أعطى نزول دهون أكثر وحافظ على النتيجة أحسن من الدايت المتواصل.</li></ul>`,
    },
    { id: 'gain', title: 'زيادة العضل بشكل نظيف', html: `
<ul><li><b>فائض صغير:</b> +200–400 سعرة فوق الحرق. الفائض الكبير يزيد دهون أكثر، مو عضل أكثر.</li><li><b>معدل الزيادة:</b> المبتدئ ~0.25–0.5% من وزنه بالشهر عضل، والمتقدم أقل.</li><li><b>زيادة تدريجية بالحمل:</b> أوزان أو تكرارات أكثر مع الوقت.</li><li><b>حجم تدريبي:</b> ~10–20 مجموعة لكل عضلة بالأسبوع لأغلب الناس (Schoenfeld 2017).</li><li><b>البروتين:</b> 1.6–2.2 غ/كغم، على 3–5 وجبات.</li></ul>
<div class="box"><p><b>إعادة التشكيل</b> <span class="en">(Recomposition)</span>: تنزل دهون وتزيد عضل بنفس الوقت. ممكنة للمبتدئين، والراجعين للتمرين بعد انقطاع، واللي عندهم دهون عالية. وتحتاج بروتين عالي وتمرين مقاومة جدي.</p></div>`,
    }
  ],
  quiz: [
    { q: 'لما تنزل دهون، أغلبها يطلع من الجسم كـ:', o: ['عرق', 'ثاني أكسيد الكاربون من الرئة', 'براز', 'تتحول لعضل'], a: 1, why: '~84% تطلع كـ CO₂ بالتنفس (Meerman & Brown 2014).' },
    { q: 'تمارين البطن تحرق دهون البطن بالذات:', o: ['صح', 'خطأ'], a: 1, why: 'الحرق الموضعي خرافة. الجسم يسحب الدهون من كل المناطق.' },
    { q: 'أهم إشارة للجسم حتى يحافظ على العضل بالدايت:', o: ['الكارديو الطويل', 'تمارين المقاومة', 'الصيام الطويل', 'شرب الماء'], a: 1, why: 'تمارين المقاومة مع البروتين الكافي هي الأساس.' }
  ]
});

<p class="lead">الكاربوهيدرات هي الوقود الأساسي للتمرين عالي الشدة، والجلايكوجين المخزون محدود. فالكمية لازم تتغير حسب حمل اليوم.</p>

<p class="muted">حسب Thomas et al. 2016 (بيان مشترك من ACSM والجمعية الأمريكية للتغذية وأطباء التغذية الكنديين)، وIOC 2011.</p>
<p><b>تحميل الكارب</b> <span class="en">(Carb loading)</span>: 10–12 غ/كغم لمدة 36–48 ساعة قبل منافسة تحمّل أطول من 90 دقيقة.</p>`,

<tr><td><b>بعد (تمرين واحد باليوم)</b></td><td>وجبتك العادية المتوازنة تكفي. المهم المجموع اليومي</td><td>—</td></tr></tbody></table></div>`,

  lessons: [
    { id: 'label', title: 'قراءة الملصق الغذائي', html: `
<ol><li><b>حجم الحصة</b> <span class="en">(Serving size)</span>: كل الأرقام لهذي الكمية. كيس شبس فيه أحياناً 3 حصص!</li>
<li><b>السعرات لكل حصة</b>، أو لكل 100 غ. الـ 100 غ أسهل للمقارنة بين منتجين.</li>

<li><b>النسبة اليومية %DV</b>: محسوبة على دايت 2000 سعرة. 5% أو أقل يعتبر قليل، و20% أو أكثر يعتبر عالي.</li>

        <a class="card mod" href="#course/refs"><span class="no">مرجع</span><b>المراجع العلمية</b><span>${REFS.reduce((a, r) => a + r[1].length, 0)} مصدر منشور ومعتمد.</span></a></div>`;
    }
    const isQuiz = lid === 'quiz';
    const L = isQuiz ? null : (M.lessons.find(l => l.id === lid) || M.lessons[0]);
    const flat = COURSE.flatMap(m => [...m.lessons.map(l => [m, l.id, l.title]), [m, 'quiz', 'اختبار: ' + m.title]]);

/* ---------- الحسابات ---------- */
function calc(a) {
  const W = +a.weight, H = +a.height, A = +a.age, male = a.sex !== 'f';
  const hm = H / 100;
  const bmi = W / (hm * hm);
  const out = { W, H, A, male, bmi };
  out.bmiCat = bmi < 18.5 ? ['نحافة', 'amber'] : bmi < 25 ? ['وزن طبيعي', 'green'] : bmi < 30 ? ['زيادة وزن', 'amber'] : bmi < 35 ? ['سمنة درجة 1', 'red'] : bmi < 40 ? ['سمنة درجة 2', 'red'] : ['سمنة درجة 3', 'red'];
  if (a.waist) out.whtr = a.waist / H;
  // نسبة الدهون — معادلة البحرية الأمريكية
  if (a.waist && a.neck && (male || a.hip)) {
    const bf = male
      ? 495 / (1.0324 - 0.19077 * Math.log10(a.waist - a.neck) + 0.15456 * Math.log10(H)) - 450
      : 495 / (1.29579 - 0.35004 * Math.log10(+a.waist + +a.hip - a.neck) + 0.22100 * Math.log10(H)) - 450;
    if (isFinite(bf) && bf > 2 && bf < 65) { out.bf = bf; out.lbm = W * (1 - bf / 100); }
  }
  out.bmr = {
    mifflin: 10 * W + 6.25 * H - 5 * A + (male ? 5 : -161),
    harris: male ? 88.362 + 13.397 * W + 4.799 * H - 5.677 * A : 447.593 + 9.247 * W + 3.098 * H - 4.330 * A
  };
  if (out.lbm) { out.bmr.katch = 370 + 21.6 * out.lbm; out.bmr.cunningham = 500 + 22 * out.lbm; }
  const bmr = out.bmr.mifflin;
  // الحرق اليومي بالطريقة التجزيئية
  const base = bmr * 1.2;
  const job = bmr * ({ sit: 0, stand: 0.1, mixed: 0.15, manual: 0.3 }[a.job || 'sit']);
  const stride = H * (male ? 0.415 : 0.413) / 100000; // كم لكل خطوة
  const extraSteps = Math.max(0, (+a.steps || 0) - 3000);
  const walk = extraSteps * stride * 0.5 * W;
  const met = { light: 3.5, moderate: 5.5, vigorous: 8 }[a.intensity || 'moderate'];
  const ex = (+a.exDays || 0) * (+a.exMin || 0) * (met - 1) * 3.5 * W / 200 / 7;
  out.parts = { base, job, walk, ex };
  out.tdee = base + job + walk + ex;
  out.pal = out.tdee / bmr;
  // الهدف
  const goal = a.goal || 'lose';
  const rate = { slow: 0.005, mid: 0.0075, fast: 0.01 }[a.pace || 'mid'];
  let target = out.tdee, deficit = 0, note2 = '';
  if (goal === 'lose') {
    deficit = Math.min(W * rate * 7700 / 7, out.tdee * 0.25);
    target = out.tdee - deficit;
    const floor = Math.max(male ? 1500 : 1200, bmr * 0.95);
    if (target < floor) { target = floor; note2 = 'السعرات ما تنزل تحت حد الأمان (الأيض الأساسي أو 1500 للرجال و1200 للنساء)، حتى لو صار النزول أبطأ.'; }
    deficit = out.tdee - target;
  } else if (goal === 'gain') target = out.tdee + (a.pace === 'fast' ? 450 : a.pace === 'slow' ? 200 : 300);
  else if (goal === 'recomp') { target = out.tdee * 0.9; deficit = out.tdee - target; }
  out.target = Math.round(target / 10) * 10;
  out.deficit = deficit; out.note2 = note2;
  out.weekly = goal === 'lose' || goal === 'recomp' ? deficit * 7 / 7700 : goal === 'gain' ? (out.target - out.tdee) * 7 / 7700 * 0.6 : 0;
  // الماكروز
  const refW = bmi > 27 ? 25 * hm * hm : W;
  const ppk = { lose: 2.0, recomp: 2.0, maintain: 1.6, gain: 1.8 }[goal];
  let protein = ppk * refW;
  if ((a.health || []).includes('kidney')) protein = 0.8 * W;
  const fat = Math.max(out.target * 0.27 / 9, 0.6 * W);
  const carbs = Math.max(0, (out.target - protein * 4 - fat * 9) / 4);
  out.macros = { protein: r0(protein / 5) * 5, fat: r0(fat), carbs: r0(carbs / 5) * 5, refW, ppk };
  out.fiber = r0(out.target / 1000 * 14);
  out.water = r1((W * 35 + (+a.exMin || 0) * (+a.exDays || 0) / 7 * 8) / 1000);
  out.hrmax = r0(208 - 0.7 * A);
  if (goal === 'lose' && a.goalWeight && a.goalWeight < W && out.weekly > 0) out.weeks = Math.ceil((W - a.goalWeight) / out.weekly);
  return out;
}

function safety(a, c) {
  const h = a.health || [];
  const blocks = [], warns = [];
  if (+a.age < 18) blocks.push('العمر أقل من 18 سنة: الجسم بعده يكبر، وحساب العجز بالسعرات ما يناسبه. استخدم الكورس للتعلم، وخلي برنامجك الغذائي يكون مع طبيب أو أخصائي تغذية أطفال ومراهقين.');
  if (h.includes('ed')) blocks.push('ذكرت تاريخ مع اضطرابات الأكل. حساب السعرات والأرقام ممكن يكون مؤذي بهذي الحالة، فما راح نعرض أرقام عجز أو أهداف وزن. الأفضل تبني خطتك مع أخصائي تغذية ومعالج نفسي مختصين، وهذا مو ضعف، هذا العلاج الصحيح. الكورس العلمي متاح لك بأي وقت.');
  if (h.includes('preg')) blocks.push('الحمل والرضاعة يحتاجون سعرات إضافية مو عجز. لازم تكون الخطة مع الطبيب المتابع.');
  if (a.goal === 'lose' && c.bmi < 18.5) blocks.push('مؤشر كتلة جسمك أقل من 18.5 (نحافة)، فما ننصح بتنزيل الوزن. غيّر الهدف لـ "زيادة عضل" أو "ثبات"، أو راجع طبيب.');
  if (h.includes('diabetes')) warns.push('السكري: توزيع الكاربوهيدرات ونوعها مهم جداً، وأدوية السكر تتأثر بالدايت. راجع طبيبك قبل ما تنزّل السعرات.');
  if (h.includes('kidney')) warns.push('أمراض الكلى: حددنا البروتين على 0.8 غ/كغم بدل الكمية العالية. لازم الطبيب يحدد كمية البروتين والبوتاسيوم والفسفور.');
  if (h.includes('bp')) warns.push('ضغط الدم: قلل الملح (أقل من 5 غ باليوم)، وكثّر الخضار والفواكه. نظام DASH مدروس لهذا.');
  if (h.includes('heart')) warns.push('أمراض القلب: لازم موافقة الطبيب قبل أي تمرين بشدة متوسطة أو عالية.');
  return { blocks, warns };
}

const choice = (k, v, b, s, multi) => {

};

function scaleBar(val, min, max, segs, label) {
  const pos = v => Math.max(0, Math.min(100, (v - min) / (max - min) * 100));
  let prev = min;
  const parts = segs.map(([to, color, name]) => { const w = pos(to) - pos(prev); const mid = pos(prev) + w / 2; const s = `<i style="width:${w}%;background:${color}"></i><span class="lb" style="left:${mid}%">${name}</span>`; prev = to; return s; }).join('');
  return `<div class="scale-bar" dir="ltr">${parts}<span class="mk" style="left:${pos(val)}%"><b>${label}</b></span></div>`;
}

  const hands = { p: r1(perMeal.p / 25), c: r1(perMeal.c / 25), f: r1(perMeal.f / 10) };
  const hIcon = (path, col) => `<svg viewBox="0 0 48 48" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
  const targetCard = `<div class="card"><h2>سعراتك وماكروزك اليومية</h2>
    <div class="grid g3">
      <div class="stat"><div class="l">هدف السعرات (${goalTxt})</div><div class="v" style="color:var(--accent)">${fmt(c.target)} <small>سعرة</small></div><div class="d">${g === 'lose' || g === 'recomp' ? `عجز ${fmt(c.deficit)} سعرة باليوم` : g === 'gain' ? `فائض ${fmt(c.target - c.tdee)} سعرة` : 'مساوي للحرق'}</div></div>
      <div class="stat"><div class="l">التغير المتوقع</div><div class="v">${c.weekly ? (g === 'gain' ? '+' : '−') + fmt(c.weekly, 2) : '0'} <small>كغم/أسبوع</small></div><div class="d">${c.weeks ? `توصل ${a.goalWeight} كغم بعد ~${c.weeks} أسبوع` : 'تقديري: 7700 سعرة ≈ 1 كغم دهون'}</div></div>
      <div class="stat"><div class="l">ماء وألياف</div><div class="v">${fmt(c.water, 1)} <small>لتر</small></div><div class="d">ألياف ${c.fiber} غ (14 غ لكل 1000 سعرة)</div></div>
    </div>
    ${c.note2 ? note('warn', c.note2) : ''}
    <div class="macro-bar" aria-label="توزيع الماكروز">
      <div style="flex:${kc.p};background:var(--muscle)">بروتين ${m.protein} غ</div>
      <div style="flex:${kc.c};background:var(--series-1)">كارب ${m.carbs} غ</div>
      <div style="flex:${kc.f};background:var(--amber)">دهون ${m.fat} غ</div></div>
    ${table(['المغذي', 'الكمية', 'سعرات', 'النسبة', 'ليش هالرقم؟'], [
      ['<b>البروتين</b>', `${m.protein} غ`, fmt(kc.p), r0(kc.p / tot * 100) + '%', (a.health || []).includes('kidney') ? '0.8 غ/كغم بسبب الكلى.' : `${m.ppk} غ × ${fmt(m.refW, 0)} كغم${c.bmi > 27 ? ' (وزن مرجعي على BMI 25، لأن الوزن الكلي يبالغ بالحساب مع السمنة)' : ''}. يحمي العضل بالعجز.`],
      ['<b>الدهون</b>', `${m.fat} غ`, fmt(kc.f), r0(kc.f / tot * 100) + '%', '~27% من السعرات، ولا تقل عن 0.6 غ/كغم. ضرورية للهرمونات وامتصاص الفيتامينات.'],
      ['<b>الكاربوهيدرات</b>', `${m.carbs} غ`, fmt(kc.c), r0(kc.c / tot * 100) + '%', 'الباقي من السعرات. وقود الدماغ والعضلات. ركّز على المعقدة والألياف.']])}
  </div>`;

  const handsCard = `<div class="card"><h2>بكل وجبة (${meals} وجبات) — بطريقة الكف</h2>
    <p class="sub" style="margin-top:0">إذا ما تحب الوزن بالغرام، يدك تكبر مع جسمك فهي مقياس شخصي.</p>
    <div class="hands">
      <div class="hand">${hIcon('<rect x="12" y="10" width="24" height="30" rx="8"/>', 'var(--muscle)')}<b class="num">${hands.p}</b><span>كف بروتين<br>(≈ ${fmt(perMeal.p)} غ بروتين)</span></div>
      <div class="hand">${hIcon('<path d="M10 22c0 9 6 16 14 16s14-7 14-16H10Z"/>', 'var(--series-1)')}<b class="num">${hands.c}</b><span>كف مضمومة كارب<br>(≈ ${fmt(perMeal.c)} غ كارب)</span></div>
      <div class="hand">${hIcon('<rect x="19" y="8" width="10" height="32" rx="5"/>', 'var(--amber)')}<b class="num">${hands.f}</b><span>إبهام دهون<br>(≈ ${fmt(perMeal.f)} غ دهون)</span></div>
      <div class="hand">${hIcon('<circle cx="24" cy="24" r="13"/>', 'var(--green)')}<b class="num">1–2</b><span>قبضة خضار<br>(بكل وجبة)</span></div>
    </div>
    ${table(['الحصة', 'أمثلة من أكلنا'], [
      ['<b>كف بروتين</b> (~25 غ بروتين)', 'صدر دجاج أو سمك 100–120 غ مطبوخ · لحم أحمر قليل الدهن 100 غ · 3–4 بيضات · علبة تونة · 250 غ لبن مصفى · كوب ونص عدس أو حمص مطبوخ'],
      ['<b>كف مضمومة كارب</b> (~25 غ كارب)', '¾ كوب تمن مطبوخ (≈ 100 غ) · نص صمونة أو نص رغيف · حبة فاكهة متوسطة · 3 تمرات · بطاطا متوسطة · كوب برغل أو شوفان مطبوخ'],
      ['<b>إبهام دهون</b> (~10 غ دهون)', 'ملعقة كبيرة زيت زيتون · 15 غ مكسرات (حفنة صغيرة) · ملعقة طحينة · ربع حبة أفوكادو · 30 غ جبن'],
      ['<b>قبضة خضار</b>', 'سلطة، خيار، طماطة، خس، كرفس، سلك، خباز، باذنجان، شجر، فاصوليا خضراء، شوربة خضار']])}
  </div>`;

  // يوم نموذجي
  const veg = a.diet === 'veg', nolact = a.diet === 'nolact';
  const P = n => `${n} كف بروتين`;
  const day = [
    ['الريوك', [veg ? `بيض مسلوق أو عجة بالخضار (${Math.min(4, Math.max(2, r0(hands.p * 3)))} بيضات) + لبن مصفى` : `${hands.p} كف بروتين: ${Math.min(4, Math.max(2, r0(hands.p * 3)))} بيضات${hands.p > 1.4 ? ` + لبن مصفى أو جبن${nolact ? ' (بدون لاكتوز)' : ''} لإكمال البروتين` : ''}`, `${hands.c} كف كارب: خبز أسمر أو صمون أو شوفان`, 'خيار وطماطة وخس بدون حد', `${hands.f} إبهام دهون: زيت زيتون أو زيتون`]],
    ['الغداء', [veg ? 'عدس أو حمص أو فاصوليا يابسة مع لبن' : `${P(hands.p)}: دجاج أو سمك أو لحم بالفرن أو مشوي`, `${hands.c} كف كارب: تمن أو برغل`, 'مرگة خضار (بامية، فاصوليا، باذنجان) بزيت قليل، وسلطة كبيرة', 'ابدأ بالسلطة قبل التمن: تشبعك أسرع']],
    ...(meals >= 3 ? [['العصر / العشاء', [veg ? 'لبن مصفى أو جبن قريش مع خضار' : `${P(hands.p)}: تونة أو دجاج أو لبن مصفى أو جبن`, `${hands.c} كف كارب: فاكهة أو نص رغيف`, 'خضار مشكلة']]] : []),
    ...(meals >= 4 ? [['وجبة خفيفة', ['حبة فاكهة + لبن أو حفنة مكسرات صغيرة']]] : []),
    ...(meals >= 5 ? [['وجبة خفيفة 2', ['خيار وجزر + لبن مصفى، أو 2–3 تمرات قبل التمرين']]] : [])
  ];
  const menuCard = `<div class="card menu-day"><h2>يوم نموذجي بأكلنا العراقي</h2>
    ${day.map(([t, items]) => `<div class="meal"><h4><span>${t}</span></h4><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`).join('')}
    ${note('info', 'الشاي: قلل الشكر تدريجياً (نص ملعقة كل أسبوع) لحد ما تتعود بدونه. وكل استكان بملعقتين شكر يساوي ~32 سعرة، و5 استكانات باليوم تقريباً 160 سعرة.')}
  </div>`;

  // بدائل الحرق
  const eq = a.equip || [];
  const gym = a.gym === 'yes';
  const usable = ACTIVITIES.filter(x => !x.avoid.some(i => inj.includes(i)))
    .filter(x => !x.needs || (x.needs === 'gym' ? gym : x.needs === 'bike' ? (gym || eq.includes('bike')) : x.needs === 'pool' ? eq.includes('pool') : true));
  const avoided = ACTIVITIES.filter(x => x.avoid.some(i => inj.includes(i)));
  const k30 = met => met * 3.5 * c.W / 200 * 30;
  const burnCard = `<div class="card"><h2>بدائل الحرق المناسبة لحالتك</h2>
    <p class="sub" style="margin-top:0">${inj.length ? `بسبب إصابة ${inj.map(i => INJ[i]).join(' و')}${gym ? '' : '، وبدون جيم'}، هذني الأنشطة اللي تناسبك. ` : gym ? '' : 'بدون جيم، هذني اللي تكدر تسويه. '}السعرات تقديرية لـ 30 دقيقة بوزنك (MET × 3.5 × الوزن ÷ 200 × الدقائق).</p>
    ${usable.sort((x, y) => y.met - x.met).map(x => `<div class="burn"><div><b>${x.n}</b> <span class="en">${x.en}</span>${x.equip && !eq.includes(x.equip) && !gym ? ' <span class="pill amber">تحتاج أداة بسيطة</span>' : ''}</div><div class="k">~${fmt(k30(x.met))}<small>سعرة / 30 د · MET ${x.met}</small></div>
      <p>${x.tip}${inj.map(i => x.cond?.[i] ? ` <b>${INJ[i]}:</b> ${x.cond[i]}` : '').join('')}</p></div>`).join('')}

  const week = `<div class="card"><h2>أسبوعك المقترح</h2>
    ${table(['النشاط', 'كم مرة', 'التفاصيل'], [
      ['تمارين مقاومة (أهم شي للحفاظ على العضل)', '2–3 مرات', inj.includes('knee') ? 'الجزء العلوي والجذع، ويا تمارين تأهيل الركبة حسب المعالج.' : 'الجسم كامل: دفع، سحب، رجلين، جذع. 2–4 مجاميع × 8–15 تكرار.'],
      ['نشاط هوائي من القائمة فوق', '2–4 مرات', 'شدة متوسطة (RPE 5–6، تكدر تحچي جمل قصيرة)، 20–40 دقيقة.'],
      ['الخطوات اليومية', 'يومياً', inj.length ? `ثبّت على معدلك الحالي (${fmt(a.steps)})، وزيد بس إذا ما يزيد الألم.` : `زيد 500–1000 خطوة على معدلك (${fmt(a.steps)}) كل أسبوع لحد 8000–10000.`],
      ['مرونة وموبيليتي', '3–5 مرات', 'من قسم <a href="#anatomy">التشريح</a>، 10 دقايق.'],
      ['النوم', 'يومياً', '7–9 ساعات. قلة النوم تخسّرك عضل بدل دهون.'],

  const hr = `<div class="card"><h2>نطاقات نبضك</h2>
    <p class="sub" style="margin-top:0">أقصى نبض تقديري: <b class="num">${c.hrmax}</b> نبضة/دقيقة (Tanaka 2001: 208 − 0.7 × ${c.A}).</p>
    ${table(['الشدة', 'نسبة من الأقصى', 'نبضك', 'الإحساس'], [
      ['خفيفة', '57–63%', `${r0(c.hrmax * .57)}–${r0(c.hrmax * .63)}`, 'RPE 2–3'],
      ['متوسطة', '64–76%', `${r0(c.hrmax * .64)}–${r0(c.hrmax * .76)}`, 'RPE 4–6، جمل قصيرة'],
      ['عالية', '77–95%', `${r0(c.hrmax * .77)}–${r0(c.hrmax * .95)}`, 'RPE 7–9، كلمات متقطعة']])}
    <span class="muted">النطاقات حسب تصنيف ACSM. أدوية مثل حاصرات بيتا تغير النبض، وبهذي الحالة اعتمد على RPE.</span></div>`;

  return `${sf.warns.map(w => note('warn', w)).join('')}
    ${top}
    <div class="stack" style="margin-top:16px">${targetCard}<div class="grid g2" style="align-items:start">${handsCard}${menuCard}</div>${burnCard}${week}<div class="grid g2" style="align-items:start">${bmiCard}${hr}</div>${eqCard}</div>
    <div class="row no-print" style="margin-top:20px"><button class="btn primary" id="printPlan">${ic('print')} طباعة / حفظ PDF</button><button class="btn" id="resetPlan">${ic('refresh')} تعديل الإجابات</button><a class="btn" href="#course">${ic('book')} افهم الأرقام بالكورس</a></div>
    <p class="muted">المراجع: Mifflin 1990؛ Roza & Shizgal 1984؛ Hodgdon & Beckett 1984 (معادلة البحرية)؛ Ainsworth 2011 (Compendium للـ MET)؛ Tanaka 2001؛ Jäger 2017 (ISSN للبروتين)؛ WHO 2008 (الخصر). التفاصيل الكاملة بقسم المراجع بالكورس.</p>`;
}

<h2>1. المستوى الكيميائي</h2><p>ذرات (كاربون، هيدروجين، أوكسجين، نيتروجين... وهذي الأربعة ~96% من وزن الجسم) تكوّن جزيئات: ماء، وبروتينات، ودهون، وكاربوهيدرات، وأحماض نووية (DNA).</p>
<h2>2. الخلية <span class="en">(Cell)</span></h2><p>أصغر وحدة حية. بجسمك تقريباً <b>37 تريليون خلية</b> (تقدير Bianconi 2013)، من أكثر من 200 نوع. وكل خلية فيها:</p>
<ul><li><b>غشاء الخلية:</b> طبقة دهنية مزدوجة تتحكم بشنو يدخل ويطلع.</li><li><b>النواة:</b> فيها الـ DNA، يعني "المخطط".</li><li><b>المايتوكوندريا:</b> محطة الطاقة. تحرق الجلوكوز والدهون وتنتج ATP. خلايا العضل فيها هواية منها.</li><li><b>الرايبوسومات:</b> مصانع البروتين.</li><li><b>الشبكة الإندوبلازمية وجهاز جولجي:</b> تعالج البروتينات وتغلفها وتوزعها.</li></ul>
<h2>3. النسيج <span class="en">(Tissue)</span></h2><p>مجموعة خلايا متشابهة تشتغل لنفس الوظيفة. أربعة أنواع بس: طلائي، وضام، وعضلي، وعصبي. <a href="#anatomy/tissues">التفاصيل بدرس الأنسجة</a>.</p>
<h2>4. العضو <span class="en">(Organ)</span></h2><p>نوعين أو أكثر من الأنسجة لوظيفة محددة. <b>العضلة نفسها عضو</b>: فيها نسيج عضلي، وضام (أغشية وأوتار)، وعصبي، وأوعية دموية. وكذلك العظمة.</p>
<h2>5. الجهاز <span class="en">(System)</span></h2>
<div class="t-wrap"><table class="t"><thead><tr><th>الجهاز</th><th>الوظيفة</th></tr></thead><tbody>
<tr><td>الهيكلي</td><td>الدعم، الحماية، الحركة، صنع الدم، خزن المعادن</td></tr><tr><td>العضلي</td><td>الحركة، الوضعية، الحرارة</td></tr><tr><td>العصبي</td><td>التحكم والإحساس</td></tr><tr><td>القلبي الوعائي</td><td>نقل الأوكسجين والمغذيات</td></tr><tr><td>التنفسي</td><td>تبادل الغازات</td></tr><tr><td>الهضمي</td><td>تفكيك الأكل وامتصاصه</td></tr><tr><td>الغدد الصماء</td><td>الهرمونات</td></tr><tr><td>اللمفاوي والمناعي</td><td>الدفاع والسوائل</td></tr><tr><td>البولي</td><td>تصفية الدم</td></tr><tr><td>التكاملي (الجلد)</td><td>الحماية والحرارة</td></tr><tr><td>التناسلي</td><td>التكاثر</td></tr></tbody></table></div>
<p>الجهاز العضلي والهيكلي يشتغلون كوحدة واحدة اسمها <b>الجهاز العضلي الهيكلي</b> <span class="en">(Musculoskeletal system)</span>، وهذا موضوع بقية القسم.</p>` },
  { id: 'tissues', title: 'الأنسجة الأربعة: الصلبة والرخوة', desc: 'الطلائي والضام والعضلي والعصبي، ومعنى Soft tissue وHard tissue.', html: `
<p class="lead">كل أنسجة الجسم ترجع لأربعة أنواع رئيسية.</p>
<div class="t-wrap"><table class="t"><thead><tr><th>النسيج</th><th>الوظيفة</th><th>أمثلة</th></tr></thead><tbody>
<tr><td><b>الطلائي</b> <span class="en">Epithelial</span></td><td>يغطي ويبطّن ويفرز</td><td>الجلد، بطانة الأمعاء، الغدد</td></tr>
<tr><td><b>الضام</b> <span class="en">Connective</span></td><td>يربط ويدعم ويحمي ويخزن وينقل</td><td>العظم، الغضروف، الأوتار، الأربطة، اللفافة، الدهون، الدم</td></tr>
<tr><td><b>العضلي</b> <span class="en">Muscle</span></td><td>الانقباض والحركة</td><td>الهيكلي، القلبي، الأملس</td></tr>
<tr><td><b>العصبي</b> <span class="en">Nervous</span></td><td>نقل الإشارات</td><td>الدماغ، الحبل الشوكي، الأعصاب</td></tr></tbody></table></div>
<h2>النسيج الضام بالتفصيل</h2><p>هذا أكثر نوع يهم الرياضي، لأن الإصابات أغلبها فيه.</p>
<ul><li><b>الضام الكثيف المنتظم</b> <span class="en">(Dense regular)</span>: ألياف كولاجين متوازية. مثل <b>الأوتار</b> (تربط العضلة بالعظم) و<b>الأربطة</b> (تربط عظم بعظم). تروية الدم بيها قليلة، لهذا شفاؤها بطيء.</li>
<li><b>الضام الكثيف غير المنتظم:</b> ألياف بكل الاتجاهات، مثل طبقة الأدمة بالجلد وكبسولات المفاصل.</li>
<li><b>الغضروف</b> <span class="en">(Cartilage)</span>: <b>زجاجي</b> يغطي نهايات العظام بالمفاصل، و<b>ليفي</b> بالأقراص بين الفقرات والغضروف الهلالي بالركبة، و<b>مرن</b> بالأذن. وما بيه أوعية دموية أصلاً.</li>
<li><b>العظم:</b> ضام متمعدن (كالسيوم وفوسفات على هيكل كولاجين).</li>
<li><b>الدهني:</b> خزن الطاقة والعزل.</li><li><b>الدم:</b> ضام سائل.</li></ul>
<h2>الأنواع الثلاثة للعضل</h2>
<div class="t-wrap"><table class="t"><thead><tr><th></th><th>الهيكلي</th><th>القلبي</th><th>الأملس</th></tr></thead><tbody>
<tr><td>التحكم</td><td>إرادي</td><td>لا إرادي</td><td>لا إرادي</td></tr><tr><td>الشكل</td><td>مخطط، طويل، متعدد الأنوية</td><td>مخطط، متفرع</td><td>غير مخطط، مغزلي</td></tr><tr><td>المكان</td><td>متصل بالعظام</td><td>القلب</td><td>جدران الأمعاء والأوعية والمثانة</td></tr></tbody></table></div>
<h2>الأنسجة الرخوة والصلبة</h2>
<p>بالطب الرياضي وطب العظام نقسم الأنسجة بطريقة عملية:</p>
<ul><li><b>الأنسجة الصلبة</b> <span class="en">(Hard tissue)</span>: العظام والأسنان. متمعدنة وقاسية.</li>
<li><b>الأنسجة الرخوة</b> <span class="en">(Soft tissue)</span>: كل شي غير متمعدن ويدعم الجسم. العضلات، والأوتار، والأربطة، واللفافة، والدهون، والأعصاب، والأوعية، والجلد، والغضاريف (بعض التصنيفات).</li></ul>
<div class="box"><p>لما يكول لك الطبيب "إصابة أنسجة رخوة"، يقصد إن العظم سليم، والإصابة بعضلة أو وتر أو رباط. والتهاب الوتر الرضفي مثلاً إصابة أنسجة رخوة. والأشعة السينية (X-ray) تبيّن العظم بوضوح، بس الأنسجة الرخوة تحتاج سونار أو رنين مغناطيسي.</p></div>` },
  { id: 'skeleton', title: 'الجهاز الهيكلي', desc: '206 عظمة، أنواعها، تركيبها، وشلون تتجدد.', html: `
<p class="lead">البالغ عنده <b>206 عظمة</b>. الطفل يولد بحدود 270 تقريباً، وكثير منها يلتحم مع النمو.</p>
<h2>قسمين</h2><ul><li><b>الهيكل المحوري</b> <span class="en">(Axial)</span>، 80 عظمة: الجمجمة، والعمود الفقري (33 فقرة عند الولادة، تلتحم السفلية لتصير العجز والعصعص)، والأضلاع، والقص.</li><li><b>الهيكل الطرفي</b> <span class="en">(Appendicular)</span>، 126 عظمة: الأطراف، وحزام الكتف، والحوض.</li></ul>
<h2>أنواع العظام حسب الشكل</h2>
<div class="t-wrap"><table class="t"><thead><tr><th>النوع</th><th>أمثلة</th></tr></thead><tbody>
<tr><td>طويلة</td><td>الفخذ، العضد، الظنبوب</td></tr><tr><td>قصيرة</td><td>عظام الرسغ والكاحل</td></tr><tr><td>مسطحة</td><td>الجمجمة، القص، لوح الكتف، الأضلاع</td></tr><tr><td>غير منتظمة</td><td>الفقرات، الحوض</td></tr><tr><td>سمسمانية (داخل وتر)</td><td>الرضفة</td></tr></tbody></table></div>
<h2>تركيب العظمة الطويلة</h2>
<ul><li><b>السمحاق</b> <span class="en">(Periosteum)</span>: غشاء خارجي فيه أعصاب وأوعية، وهو ليش الكسر يؤلم.</li><li><b>العظم المضغوط</b> <span class="en">(Cortical)</span>: الطبقة الخارجية القوية.</li><li><b>العظم الإسفنجي</b> <span class="en">(Trabecular)</span>: بالنهايات، شبكة خفيفة وقوية.</li><li><b>النخاع</b>: الأحمر يصنع خلايا الدم، والأصفر دهني.</li><li><b>صفيحة النمو</b> <span class="en">(Epiphyseal plate)</span>: عند الأطفال والمراهقين، ومنها يطول العظم.</li></ul>
<h2>العظم نسيج حي يتجدد</h2>
<p>خلايا <b>بانية</b> <span class="en">(Osteoblasts)</span> تبني، وخلايا <b>هادمة</b> <span class="en">(Osteoclasts)</span> تهدم. والهيكل يتجدد بالكامل تقريباً كل ~10 سنوات. <b>قانون وولف</b> <span class="en">(Wolff's law)</span>: العظم يتكيف مع الحمل اللي عليه، فتمارين المقاومة والقفز تقويه، وقلة الحركة تضعفه.</p>
<h2>وظائف الهيكل</h2><p>الدعم، وحماية الأعضاء (الجمجمة للدماغ والأضلاع للقلب)، والرافعات للحركة، وصنع الدم، وخزن الكالسيوم والفوسفات.</p>` },
  { id: 'muscles', title: 'الجهاز العضلي', desc: 'من العضلة إلى الساركومير، أنواع الألياف والانقباض.', html: `
<p class="lead">بجسمك أكثر من 600 عضلة هيكلية، وتشكل ~40% من وزن الجسم عند البالغ غير الرياضي.</p>
<h2>من العضلة إلى الجزيء</h2>
<ol><li><b>العضلة</b> ملفوفة بغشاء ضام (Epimysium).</li><li><b>الحزم</b> <span class="en">(Fascicles)</span> داخلها.</li><li><b>الليف العضلي</b> <span class="en">(Muscle fiber)</span>: خلية وحدة طويلة جداً (ممكن عدة سنتيمترات) ومتعددة الأنوية.</li><li><b>اللييفات</b> <span class="en">(Myofibrils)</span>: داخل كل ليف.</li><li><b>الساركومير</b> <span class="en">(Sarcomere)</span>: الوحدة اللي تنقبض فعلياً.</li></ol>
<figure>${SARC_SVG}<figcaption>الساركومير: خيوط الميوسين السميكة "تجذّف" على خيوط الأكتين الرفيعة وتسحبها نحو المركز، فيقصر الساركومير. هذي نظرية <b>الخيوط المنزلقة</b> (Sliding filament theory). الطاقة من ATP، والإشارة من الكالسيوم.</figcaption></figure>
<h2>أنواع الألياف</h2>
<div class="t-wrap"><table class="t"><thead><tr><th>النوع</th><th>السرعة</th><th>التحمل</th><th>مثال</th></tr></thead><tbody>
<tr><td><b>Type I</b> بطيئة (حمراء)</td><td>بطيئة</td><td>عالي جداً (مايتوكوندريا كثيرة)</td><td>عضلات الوضعية، الماراثون</td></tr>
<tr><td><b>Type IIa</b> سريعة مؤكسدة</td><td>سريعة</td><td>متوسط</td><td>كرة القدم، 800 متر</td></tr>
<tr><td><b>Type IIx</b> سريعة جلايكوليتية</td><td>الأسرع</td><td>قليل</td><td>الركض السريع، القفز</td></tr></tbody></table></div>
<h2>أنواع الانقباض</h2>
<ul><li><b>مركزي</b> <span class="en">(Concentric)</span>: العضلة تقصر، مثل صعود الدرج.</li><li><b>لا مركزي</b> <span class="en">(Eccentric)</span>: العضلة تطول وهي تقاوم، مثل نزول الدرج. أقوى نوع، ويسبب أكثر ألم بعد التمرين (DOMS).</li><li><b>ثابت</b> <span class="en">(Isometric)</span>: بدون تغير بالطول، مثل البلانك والجلوس على الحائط. مهم بالتأهيل.</li></ul>
<h2>أدوار العضلات بالحركة</h2>
<ul><li><b>المحركة الرئيسية</b> <span class="en">(Agonist)</span>: مثل البايسبس بثني الكوع.</li><li><b>المعاكسة</b> <span class="en">(Antagonist)</span>: الترايسبس بنفس الحركة.</li><li><b>المساعدة</b> <span class="en">(Synergist)</span>، و<b>المثبتة</b> <span class="en">(Stabilizer)</span>.</li></ul>
<p>كل عضلة لها <b>منشأ</b> <span class="en">(Origin)</span> ثابت نسبياً، و<b>مدغم</b> <span class="en">(Insertion)</span> يتحرك.</p>` },
  { id: 'joints', title: 'المفاصل والحركة', desc: 'أنواع المفاصل، ومصطلحات الحركة، والفرق بين المرونة والموبيليتي.', html: `
<h2>أنواع المفاصل حسب التركيب</h2>
<ul><li><b>ليفية</b> <span class="en">(Fibrous)</span>: ما تتحرك تقريباً، مثل دروز الجمجمة.</li><li><b>غضروفية</b> <span class="en">(Cartilaginous)</span>: حركة محدودة، مثل الأقراص بين الفقرات وارتفاق العانة.</li><li><b>زلالية</b> <span class="en">(Synovial)</span>: حرة الحركة، وهي أغلب مفاصل الأطراف.</li></ul>
<h2>المفصل الزلالي</h2><p>غضروف زجاجي يغطي نهايات العظام، وكبسولة، وغشاء زلالي يفرز <b>السائل الزلالي</b> (زيت المفصل وغذاء الغضروف)، وأربطة. وبعض المفاصل فيها غضاريف إضافية مثل الهلالي بالركبة، وأكياس (Bursae).</p>
<div class="box green"><p><b>الحركة تغذي المفصل:</b> الغضروف ما بيه دم، ويتغذى من السائل الزلالي اللي "ينعصر" بداخله مع الحركة والضغط. لهذا تمارين الموبيليتي اليومية تحسن صحة المفصل حتى لو بدون تمرين ثقيل.</p></div>
<h2>أنواع المفاصل الزلالية الستة</h2>
<div class="t-wrap"><table class="t"><thead><tr><th>النوع</th><th>الحركة</th><th>مثال</th></tr></thead><tbody>
<tr><td>كروي حقي (Ball & socket)</td><td>بكل الاتجاهات</td><td>الكتف، الورك</td></tr><tr><td>رزّي (Hinge)</td><td>اتجاه واحد</td><td>الكوع، الركبة (معدّل)</td></tr><tr><td>محوري (Pivot)</td><td>دوران</td><td>C1–C2 بالرقبة</td></tr><tr><td>لقمي (Condyloid)</td><td>اتجاهين</td><td>الرسغ</td></tr><tr><td>سرجي (Saddle)</td><td>اتجاهين وأكثر</td><td>قاعدة الإبهام</td></tr><tr><td>منزلق (Plane)</td><td>انزلاق</td><td>بين عظام الرسغ</td></tr></tbody></table></div>
<h2>مصطلحات الحركة</h2>
<div class="t-wrap"><table class="t"><tbody>
<tr><td><b>ثني / مد</b> <span class="en">Flexion / Extension</span></td><td>تصغير الزاوية / تكبيرها</td></tr><tr><td><b>تبعيد / تقريب</b> <span class="en">Abduction / Adduction</span></td><td>بعيد عن الخط الوسط / نحوه</td></tr><tr><td><b>دوران داخلي / خارجي</b></td><td>نحو الخط الوسط / بعيد عنه</td></tr><tr><td><b>كب / بطح</b> <span class="en">Pronation / Supination</span></td><td>الكف لتحت / لفوق</td></tr><tr><td><b>ثني ظهري / أخمصي</b> <span class="en">Dorsiflexion / Plantarflexion</span></td><td>رفع مشط القدم / رفع الكعب</td></tr><tr><td><b>قلب / بسط</b> <span class="en">Inversion / Eversion</span></td><td>باطن القدم للداخل / للخارج</td></tr></tbody></table></div>
<p><b>المستويات الثلاثة:</b> السهمي <span class="en">(Sagittal)</span> للحركة قدام وورا، والجبهي <span class="en">(Frontal)</span> للجانبين، والمستعرض <span class="en">(Transverse)</span> للدوران.</p>
<h2>المرونة والموبيليتي والتقوية والتحمل</h2>
<div class="t-wrap"><table class="t"><thead><tr><th>النوع</th><th>التعريف</th><th>الجرعة العامة (ACSM)</th></tr></thead><tbody>
<tr><td><span class="pill acc">حركة (موبيليتي)</span></td><td>قدرتك تحرك المفصل بنشاط وتحكم بمداه الكامل</td><td>يومياً، 5–10 دقايق، حركات بطيئة مضبوطة</td></tr>
<tr><td><span class="pill green">مرونة (إطالة)</span></td><td>قابلية العضلة تطول. ممكن يكون بمساعدة (Passive)</td><td>2–3 أيام بالأسبوع على الأقل، 10–30 ثانية للإطالة، ومجموع ~60 ثانية لكل عضلة</td></tr>
<tr><td><span class="pill muscle">تقوية</span></td><td>إنتاج قوة أكبر</td><td>2–3 أيام بالأسبوع، 8–12 تكرار، 2–4 مجاميع</td></tr>
<tr><td><span class="pill amber">تحمّل</span></td><td>تكرار الجهد لفترة أطول بدون تعب</td><td>15–25 تكرار، أو ثبات طويل، وراحة قصيرة</td></tr></tbody></table></div>` }
];

VIEWS.anatomy = {
  view: 'front', cat: 'all', kneeOnly: false,
  html(sub, rid) {
    const V = VIEWS.anatomy;
    if (sub && sub !== 'region') {
      const T = ANAT_TOPICS.find(t => t.id === sub);
      if (T) {
        const i = ANAT_TOPICS.indexOf(T), nx = ANAT_TOPICS[i + 1], pv = ANAT_TOPICS[i - 1];
        return `<div class="crumbs"><a href="#anatomy">التشريح</a> ‹ ${T.title}</div><article class="article"><h1>${T.title}</h1>${T.html}
          <h2>المراجع</h2><ol class="refs"><li>OpenStax. Anatomy and Physiology 2e. Rice University; 2022 (open access).</li><li>Tortora GJ, Derrickson B. Principles of Anatomy and Physiology. 16th ed. Wiley; 2020.</li><li>Bianconi E, et al. An estimation of the number of cells in the human body. Ann Hum Biol. 2013;40(6):463–471.</li><li>Garber CE, et al. ACSM position stand: quantity and quality of exercise. Med Sci Sports Exerc. 2011;43(7):1334–1359.</li></ol>
          <div class="lesson-nav">${pv ? `<a class="btn" href="#anatomy/${pv.id}">${ic('prev')} ${pv.title}</a>` : '<a class="btn" href="#anatomy">' + ic('prev') + ' التشريح</a>'}${nx ? `<a class="btn primary" href="#anatomy/${nx.id}">${nx.title} ${ic('next')}</a>` : `<a class="btn primary" href="#anatomy">خريطة الجسم ${ic('next')}</a>`}</div></article>`;
      }
    }
    const R = sub === 'region' ? REGIONS.find(r => r.id === rid) : null;
